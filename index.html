<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>RingDay Live Drive v21</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0} body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#05070a;color:#fff;overflow:hidden}
#map{position:fixed;inset:0;background:#111827}
.panel{position:fixed;z-index:1000;left:12px;right:12px;background:rgba(5,7,10,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 35px rgba(0,0,0,.35)}
.top{top:calc(env(safe-area-inset-top) + 28px);padding:13px 14px;border-radius:20px;display:flex;justify-content:space-between;align-items:center}
.brand small{display:block;font-size:9px;letter-spacing:1.3px;color:#9ca3af;font-weight:900} .brand b{font-size:24px}
.badge{padding:8px 10px;border-radius:999px;background:rgba(34,197,94,.14);color:#86efac;font-size:10px;font-weight:900}
.next{top:calc(env(safe-area-inset-top) + 116px);padding:12px 14px;border-radius:18px;display:flex;justify-content:space-between;align-items:end}
.next small{display:block;color:#9ca3af;font-weight:800;font-size:9px;letter-spacing:.8px} .next b{font-size:22px} .next strong{font-size:28px}
.bottom{bottom:max(12px,env(safe-area-inset-bottom));padding:13px;border-radius:24px}
.session{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.08)} .session .stat b{font-size:17px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px} .stat small{display:block;color:#6b7280;font-size:9px;font-weight:900} .stat b{font-size:21px} .stat span{font-size:9px;color:#9ca3af}
.buttons{display:flex;gap:8px;margin-top:11px} button{border:0;border-radius:14px;padding:12px;font-weight:900;font-size:13px} .primary{flex:1;background:#16a34a;color:white} .secondary{background:#1f2937;color:white}
.floating{position:fixed;z-index:1100;right:16px;top:47%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;padding:8px;border-radius:999px;background:rgba(5,7,10,.34);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.22)} .circle{display:grid;place-items:center;width:52px;height:52px;min-width:52px;min-height:52px;padding:0;margin:0;border-radius:50%;background:rgba(5,7,10,.96);color:#fff;font-size:20px;line-height:52px;text-align:center;border:1.5px solid rgba(255,255,255,.22);box-shadow:0 5px 16px rgba(0,0,0,.32);transition:transform .12s ease,background .12s ease,border-color .12s ease} .circle:active{transform:scale(.94)} .circle.active{background:rgba(22,163,74,.96);border-color:rgba(134,239,172,.8)} .circle .tiny{display:grid;place-items:center;width:100%;height:100%;font-size:16px;font-weight:900;letter-spacing:-1px;line-height:1;text-align:center} @media(max-height:700px){.floating{top:50%;gap:8px;padding:6px}.circle{width:46px;height:46px;min-width:46px;min-height:46px}}
.corner-label{background:rgba(5,7,10,.80);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:3px 6px;font-size:10px;font-weight:800;white-space:nowrap;box-shadow:none}
.arrow{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:25px;filter:drop-shadow(0 2px 4px #000)}

#navArrow{
  position:fixed;
  z-index:1050;
  left:50%;
  top:50%;
  width:34px;
  height:34px;
  margin-left:-17px;
  margin-top:-17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  color:#16a34a;
  text-shadow:0 2px 5px rgba(0,0,0,.9);
  pointer-events:none;
  transform-origin:50% 50%;
  opacity:0;
  transition:opacity .15s ease;
}
#navArrow.on{opacity:1}

.note{font-size:9px;color:#6b7280;text-align:center;margin-top:8px}
.error{display:none;position:fixed;z-index:1600;left:22px;right:22px;top:150px;background:rgba(127,29,29,.94);padding:10px;border-radius:13px;text-align:center;font-size:11px}
.leaflet-control-attribution{font-size:7px!important}
@media (display-mode: browser){.top{top:calc(env(safe-area-inset-top) + 68px)}.next{top:calc(env(safe-area-inset-top) + 154px)}}
@media (max-height:720px){.brand b{font-size:20px}.next b{font-size:18px}.next strong{font-size:23px}.bottom{padding:10px}.note{display:none}}

/* v14: klare Ein-Kurven-Vorschau */
#next{
  font-size:clamp(22px,5.8vw,34px);
  font-weight:900;
  letter-spacing:-.5px;
}
#dist{
  font-size:clamp(25px,6.4vw,38px);
  font-weight:950;
  color:#86efac;
}
.nextCard{
  box-shadow:0 14px 38px rgba(0,0,0,.34);
}
@media (orientation:portrait) and (max-width:500px){
  .top{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
}


/* v15 CLEAN MAP — ruhiger, heller, iPhone-Retina-freundlicher Kartenlook */
#map{background:#e9eee7}
.leaflet-tile-pane{
  filter:saturate(.62) contrast(.94) brightness(1.055);
  -webkit-filter:saturate(.62) contrast(.94) brightness(1.055);
}
.leaflet-tile{
  image-rendering:auto;
  transform:translateZ(0);
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}
.leaflet-overlay-pane svg{
  shape-rendering:geometricPrecision;
}
.leaflet-control-attribution{
  background:rgba(255,255,255,.82)!important;
  color:#5b6470!important;
  border-radius:8px 0 0 0;
  padding:2px 5px!important;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.corner-label{
  background:rgba(7,10,12,.86);
  border:1px solid rgba(255,255,255,.14);
  font-size:10px;
  padding:4px 7px;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
}
/* Strecke bekommt eine dunkle Kontur und bleibt auf jeder Kartenfarbe sauber lesbar. */


/* v16 POLISH — kleine Profi-Details, keine Funktionsüberladung */
:root{
  --panel:rgba(5,8,10,.94);
  --panel-soft:rgba(5,8,10,.86);
  --text:#f8fafc;
  --muted:#94a3b8;
  --green:#22c55e;
}
.top,.nextCard,.bottomPanel{
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 16px 42px rgba(0,0,0,.28);
}
.top,.nextCard{
  background:linear-gradient(180deg,rgba(7,10,12,.96),rgba(5,8,10,.92));
}
.circle{
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 8px 22px rgba(0,0,0,.30);
}
.circle:focus-visible{
  outline:2px solid rgba(134,239,172,.9);
  outline-offset:3px;
}
.circle.active{
  box-shadow:0 0 0 1px rgba(134,239,172,.35),0 8px 22px rgba(0,0,0,.30);
}
#navArrow{
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.75));
}
#speed{
  font-variant-numeric:tabular-nums;
}
#dist,#lastLap,#bestLap{
  font-variant-numeric:tabular-nums;
}
.safety{
  opacity:.76;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
@media(max-width:390px){
  .circle{width:58px;height:58px;min-width:58px;min-height:58px}
}


/* v19 Stable: Buttons sicher über der Karte, ohne Touch-/Kartenlogik zu verändern */
.floating{z-index:2000!important}
.circle{
  z-index:2001;
  pointer-events:auto;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

</style>
</head>
<body>
<div id="map"></div>
<div id="navArrow" aria-hidden="true">▲</div>

<div class="panel top">
  <div class="brand"><small>NORDSCHLEIFE · LIVE DRIVE</small><b>RingDay</b></div>
  <div id="gps" class="badge">GPS …</div>
</div>

<div class="panel next">
  <div><small>NÄCHSTER ABSCHNITT</small><b id="nextName">–</b></div>
  <div style="text-align:right"><small>ENTFERNUNG</small><strong id="nextDist">–</strong> <span>m</span></div>
</div>

<div id="error" class="error"></div>

<div class="floating">
  <button id="all" class="circle" aria-label="Ganze Strecke" title="Ganze Strecke"><span class="tiny">#</span></button>
  <button id="drive" class="circle active" aria-label="GPS folgen" title="GPS folgen"><span class="tiny">◎</span></button>
  <button id="labels" class="circle" aria-label="Kurvennamen ein oder aus" title="Kurvennamen ein oder aus"><span class="tiny">Aa</span></button>
</div>

<div class="panel bottom">
  <div class="stats">
    <div class="stat"><small>GESCHW.</small><b id="speed">0</b> <span>km/h</span></div>
    <div class="stat"><small>RICHTUNG</small><b id="heading">–</b> <span>°</span></div>
    <div class="stat"><small>GPS</small><b id="accuracy">–</b> <span>m</span></div>
    <div class="stat"><small>SPUR</small><b id="distance">0.0</b> <span>km</span></div>
  </div>
  <div class="session">
    <div class="stat"><small>RUNDEN</small><b id="laps">0</b></div>
    <div class="stat"><small>LETZTE</small><b id="lastLap">–</b></div>
    <div class="stat"><small>BESTE</small><b id="bestLap">–</b></div>
  </div>
  <div class="buttons">
    <button id="record" class="primary">● Live-Spur aktiv</button>
    <button id="reset" class="secondary">Reset</button>
  </div>
  <div class="note">Nur im Stand bedienen. Kurvenanzeige dient zur Orientierung, nicht als Fahrempfehlung.</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const corners=[{name:'Antoniusbuche',lat:50.34335427126488,lng:6.959665494945257},{name:'Tiergarten',lat:50.33985665442039,lng:6.955325475071894},{name:'Hohenrain',lat:50.338093435965874,lng:6.953110038228076},{name:'T13',lat:50.33770735927043,lng:6.951175132660068},{name:'Sabine-Schmitz-Kurve',lat:50.33931589444242,lng:6.948291028484586},{name:'Hatzenbach',lat:50.33792421328012,lng:6.939048655331739},{name:'Hocheichen',lat:50.34116214868135,lng:6.933245842474793},{name:'Quiddelbacher Höhe',lat:50.34491336010781,lng:6.9268066430396935},{name:'Flugplatz',lat:50.34664295293831,lng:6.925786056584946},{name:'Kottenborn',lat:50.349214681877456,lng:6.9268995461934235},{name:'Schwedenkreuz',lat:50.35645626438514,lng:6.9231103978668385},{name:'Aremberg',lat:50.357884552356985,lng:6.920051009849555},{name:'Fuchsröhre',lat:50.36271416227066,lng:6.929376100870357},{name:'Adenauer Forst',lat:50.36633007227384,lng:6.9315961001865345},{name:'Metzgesfeld',lat:50.37233854153692,lng:6.9375224812493075},{name:'Kallenhard',lat:50.37441023491822,lng:6.933556773621743},{name:'Spiegelkurve',lat:50.37616287054923,lng:6.936750730923182},{name:'Dreifach-Rechts',lat:50.377859719725535,lng:6.939196905544764},{name:'Wehrseifen',lat:50.376084184538286,lng:6.9429412693295545},{name:'Breidscheid',lat:50.37697367097372,lng:6.950059852055079},{name:'Ex-Mühle',lat:50.37826681765724,lng:6.950521192005641},{name:'Lauda-links',lat:50.379775260793856,lng:6.957593827877204},{name:'Bergwerk',lat:50.380822034715514,lng:6.960887580547492},{name:'Kesselchen',lat:50.3744787974163,lng:6.9673027265349186},{name:'Mutkurve',lat:50.37220019051843,lng:6.979830481762637},{name:'Klostertal',lat:50.374153033918944,lng:6.9847913280573115},{name:'Steilstrecke',lat:50.37457726987569,lng:6.988975574120544},{name:'Caracciola-Karussell',lat:50.37178545392126,lng:6.985703279122375},{name:'Hohe Acht',lat:50.376842078295546,lng:6.995133926018737},{name:'Hedwigshöhe',lat:50.3760415390335,lng:6.99947036482274},{name:'Wippermann',lat:50.37356457131133,lng:7.003740441574449},{name:'Eschbach',lat:50.371614381425644,lng:7.002807032837266},{name:'Brünnchen',lat:50.37004686683078,lng:7.005555250998308},{name:'Eiskurve',lat:50.36871243611243,lng:7.001735785361101},{name:'Pflanzgarten',lat:50.363883925517634,lng:6.999590387707291},{name:'Pflanzgarten II',lat:50.36279571274873,lng:6.997069111233292},{name:'Sprunghügel',lat:50.361676675484716,lng:6.995262475823698},{name:'Stefan-Bellof-S',lat:50.359520657750515,lng:6.992494436120329},{name:'Schwalbenschwanz',lat:50.358911479440515,lng:6.983793350076017},{name:'Kleines Karussell',lat:50.357652029830746,lng:6.981154056405363},{name:'Galgenkopf',lat:50.35405472881242,lng:6.986198946607631},{name:'Döttinger Höhe',lat:50.34872277143594,lng:6.972756860436196}];
const map=L.map('map',{
  zoomControl:false,
  preferCanvas:true,
  zoomSnap:.25,
  zoomDelta:.5,
  inertia:true,
  fadeAnimation:false,
  markerZoomAnimation:false,
  tap:false,
  bounceAtZoomLimits:false
}).setView([50.35,6.96],13);

// Hochauflösende OSM-Karte. detectRetina lädt auf iPhones schärfere Kacheln.
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxNativeZoom:19,
  maxZoom:20,
  detectRetina:true,
  updateWhenIdle:false,
  updateWhenZooming:true,
  keepBuffer:6,
  attribution:'© OpenStreetMap contributors'
}).addTo(map);

let trackHaloLayer=null,trackLayer=null,trackCoords=[],trackCum=[],trackLen=0,trackPrecise=false,routeOrientation=1,cornerProgress=[],trail=[],trailLayer=L.polyline([],{color:'#38bdf8',weight:4,opacity:.9,lineCap:'round',lineJoin:'round'}).addTo(map);
let userMarker=null,lastPos=null,lastFixTime=null,totalM=0,recording=true,follow=true,labelsVisible=false;
let laps=0,bestLapMs=null,lapStartMs=null,lastLapAt=0,wakeLock=null,smoothedHeading=null,lastRouteProgress=null,geoWatchId=null,displayPos=null,lastMapMove=0;
let lastGoodFix=0,lastSpeedMps=0;
const gate=[50.346645358869175,6.965806730462019];
let cornerLayers=[];

function dist(a,b){
 const R=6371000,rad=x=>x*Math.PI/180,dlat=rad(b[0]-a[0]),dlon=rad(b[1]-a[1]),la1=rad(a[0]),la2=rad(b[0]);
 const h=Math.sin(dlat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlon/2)**2; return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a,b){
 const r=x=>x*Math.PI/180,d=x=>x*180/Math.PI,la1=r(a[0]),la2=r(b[0]),dl=r(b[1]-a[1]);
 const y=Math.sin(dl)*Math.cos(la2),x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dl);
 return (d(Math.atan2(y,x))+360)%360;
}
function showError(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block'}
function hideError(){document.getElementById('error').style.display='none'}
function fmtTime(ms){if(!ms||ms<0)return '–';const sec=Math.floor(ms/1000),m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,'0')}`}
async function keepAwake(){try{if('wakeLock' in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch(e){console.warn('Wake Lock nicht verfügbar',e)}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});

corners.forEach((c,i)=>{
 const icon=L.divIcon({className:'',html:`<div class="corner-label">${i+1}. ${c.name}</div>`,iconAnchor:[8,12]});
 const m=L.marker([c.lat,c.lng],{icon,interactive:false}); if(labelsVisible)m.addTo(map); cornerLayers.push(m);
});

async function loadTrack(){
 const cacheKey='ringday-nordschleife-static-v2';
 const draw=(coords)=>{
   trackCoords=coords;
   trackPrecise=Array.isArray(coords)&&coords.length>1000;
   buildTrackIndex();
   if(trackLayer)map.removeLayer(trackLayer);
   if(trackHaloLayer)map.removeLayer(trackHaloLayer);
   trackHaloLayer=L.polyline(trackCoords,{
     color:'#06110a',weight:10,opacity:.52,lineCap:'round',lineJoin:'round',interactive:false
   }).addTo(map);
   trackLayer=L.polyline(trackCoords,{
     color:'#22c55e',weight:5.5,opacity:1,lineCap:'round',lineJoin:'round',interactive:false
   }).addTo(map);
   setTimeout(()=>map.invalidateSize(),150);
 };
 try{
  const cached=localStorage.getItem(cacheKey);
  if(cached){
   const coords=JSON.parse(cached);
   if(Array.isArray(coords)&&coords.length>1000){draw(coords);return;}
  }
 }catch(e){console.warn('Track-Cache nicht lesbar',e)}

 // Statische Touristenfahrten-Geometrie (~3000 Punkte), damit RingDay nicht
 // bei jedem Start von einer Overpass-Abfrage abhängt.
 try{
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),10000);
   const r=await fetch('https://raw.githubusercontent.com/maciejb2k/nurburgring-nordschleife-geojson/master/touristenfahrten.geojson',{cache:'force-cache',signal:controller.signal});
   clearTimeout(timer);
   if(!r.ok)throw new Error('HTTP '+r.status);
   const gj=await r.json();
   const raw=gj?.features?.[0]?.geometry?.coordinates;
   if(!Array.isArray(raw)||raw.length<1000)throw new Error('Ungültige GeoJSON-Geometrie');
   const coords=raw.map(([lng,lat])=>[lat,lng]);
   draw(coords);
   try{localStorage.setItem(cacheKey,JSON.stringify(coords))}catch(e){}
   return;
 }catch(e){console.warn('Statische Nordschleife nicht geladen:',e)}

 // Nur noch Notfall-Fallback: aktuelle OSM-Daten via Overpass.
 const q=`[out:json][timeout:25];(way["highway"="raceway"]["name"~"Nordschleife",i](50.30,6.88,50.40,7.06);way["name"~"Nürburgring.*Nordschleife",i](50.30,6.88,50.40,7.06););out geom;`;
 const endpoints=['https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter'];
 for(const endpoint of endpoints){
  try{
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),10000);
   const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q),signal:controller.signal});
   clearTimeout(timer);
   if(!r.ok)throw new Error('HTTP '+r.status);
   const d=await r.json();
   const segs=d.elements.filter(x=>x.type==='way'&&x.geometry?.length>1).map(x=>x.geometry.map(p=>[p.lat,p.lon]));
   if(!segs.length)throw new Error('Keine Streckendaten');
   const coords=join(segs);
   draw(coords);
   try{localStorage.setItem(cacheKey,JSON.stringify(coords))}catch(e){}
   return;
  }catch(e){console.warn('Track-Quelle fehlgeschlagen:',endpoint,e)}
 }

 // Letzter visueller Fallback. Nicht für präzise Streckenlogik verwenden.
 trackCoords=corners.map(c=>[c.lat,c.lng]);
 if(trackHaloLayer)map.removeLayer(trackHaloLayer);
 trackHaloLayer=L.polyline(trackCoords,{color:'#06110a',weight:7,opacity:.28,dashArray:'7 7',interactive:false}).addTo(map);
 trackLayer=L.polyline(trackCoords,{color:'#22c55e',weight:3.5,opacity:.62,dashArray:'7 7',interactive:false}).addTo(map);
}
function join(segs){
 const left=segs.map(s=>s.slice()),path=left.shift()||[],d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;
 while(left.length){const t=path[path.length-1];let bi=0,rev=false,best=Infinity;
  left.forEach((s,i)=>{let a=d2(t,s[0]),b=d2(t,s[s.length-1]);if(a<best){best=a;bi=i;rev=false}if(b<best){best=b;bi=i;rev=true}});
  let n=left.splice(bi,1)[0];if(rev)n.reverse();if(d2(path[path.length-1],n[0])<1e-12)n=n.slice(1);path.push(...n);
 }return path;
}
function buildTrackIndex(){
 trackCum=[0];trackLen=0;cornerProgress=[];
 if(trackCoords.length<2)return;
 for(let i=1;i<trackCoords.length;i++){trackLen+=dist(trackCoords[i-1],trackCoords[i]);trackCum.push(trackLen)}
 if(!trackPrecise)return;
 const raw=corners.map(c=>projectToTrack([c.lat,c.lng],true)?.progress??0);
 let f=0,r=0;
 for(let i=0;i<raw.length-1;i++){f+=(raw[i+1]-raw[i]+trackLen)%trackLen;r+=(raw[i]-raw[i+1]+trackLen)%trackLen}
 routeOrientation=f<=r?1:-1;
 cornerProgress=raw.map(p=>toRouteProgress(p));
}
function projectToTrack(pos,force=false){
 if(trackCoords.length<2)return null;
 const lat0=pos[0]*Math.PI/180, mx=111320*Math.cos(lat0), my=110540;
 let bestD2=Infinity,bestI=0,bestT=0;
 for(let i=0;i<trackCoords.length-1;i++){
   const a=trackCoords[i],b=trackCoords[i+1];
   const ax=(a[1]-pos[1])*mx,ay=(a[0]-pos[0])*my,bx=(b[1]-pos[1])*mx,by=(b[0]-pos[0])*my;
   const vx=bx-ax,vy=by-ay,den=vx*vx+vy*vy;
   let t=den?-(ax*vx+ay*vy)/den:0;t=Math.max(0,Math.min(1,t));
   const x=ax+t*vx,y=ay+t*vy,d2=x*x+y*y;
   if(d2<bestD2){bestD2=d2;bestI=i;bestT=t}
 }
 const seg=dist(trackCoords[bestI],trackCoords[bestI+1]);
 return{distance:Math.sqrt(bestD2),progress:(trackCum[bestI]||0)+bestT*seg,index:bestI};
}
function toRouteProgress(raw){if(!trackLen)return raw;return routeOrientation===1?raw:(trackLen-raw)%trackLen}
function nextSection(routeP){
 if(!cornerProgress.length||!trackLen)return null;
 let best=null;
 corners.forEach((c,i)=>{let d=(cornerProgress[i]-routeP+trackLen)%trackLen;if(d<18)d+=trackLen;if(!best||d<best.d)best={...c,i,d}});
 return best;
}
function onPos(p){
 hideError();const c=p.coords,pos=[c.latitude,c.longitude],fixTime=p.timestamp||Date.now();
 const dt=lastFixTime?Math.max(.1,(fixTime-lastFixTime)/1000):null;
 const step=lastPos?dist(lastPos,pos):0;
 const derivedSpeed=(lastPos&&dt)?step/dt:0;
 const speedMps=(c.speed!=null&&c.speed>=0)?c.speed:derivedSpeed;
 const jump=!!(lastPos&&dt&&dt<5&&step>Math.max(120,(speedMps+25)*dt));
 const rawHdg=(c.heading!=null&&c.heading>=0&&speedMps>1.5)?c.heading:(lastPos&&!jump?bearing(lastPos,pos):(smoothedHeading??0));
 if(smoothedHeading==null)smoothedHeading=rawHdg;else{const delta=((rawHdg-smoothedHeading+540)%360)-180;smoothedHeading=(smoothedHeading+delta*.28+360)%360}
 const hdg=smoothedHeading;
 lastGoodFix=Date.now();lastSpeedMps=speedMps;
 const gps=document.getElementById('gps');gps.textContent=c.accuracy<=15?'GPS SEHR GUT':c.accuracy<=30?'GPS GUT':'GPS SCHWACH';gps.style.color=c.accuracy<=30?'#86efac':'#fde68a';
 document.getElementById('speed').textContent=Math.max(0,Math.round(speedMps*3.6));
 document.getElementById('heading').textContent=Math.round(hdg);
 document.getElementById('accuracy').textContent=c.accuracy?Math.round(c.accuracy):'–';

 const icon=L.divIcon({className:'',html:`<div class="arrow" style="transform:rotate(${hdg}deg)">▲</div>`,iconSize:[32,32],iconAnchor:[16,16]});
 if(!userMarker)userMarker=L.marker(pos,{icon,zIndexOffset:1000}).addTo(map);else{userMarker.setLatLng(pos);userMarker.setIcon(icon)}
 const navArrow=document.getElementById('navArrow');
 navArrow.style.transform=`rotate(${hdg}deg)`;
 navArrow.classList.toggle('on',follow);
 if(userMarker)userMarker.setOpacity(follow?0:1);

 if(!jump&&recording&&(!lastPos||step>=1.5)){if(lastPos)totalM+=step;trail.push(pos);trailLayer.setLatLngs(trail);document.getElementById('distance').textContent=(totalM/1000).toFixed(1)}

 const ringCenter=[50.3466,6.9658],distanceToRing=dist(pos,ringCenter);
 const proj=trackPrecise?projectToTrack(pos):null;
 const onTrack=!!(proj&&distanceToRing<5000&&proj.distance<=Math.max(35,Math.min(75,(c.accuracy||25)*1.7)));
 let routeP=null;
 if(onTrack){
   routeP=toRouteProgress(proj.progress);
   const next=nextSection(routeP);
   document.getElementById('nextName').textContent=next?next.name:'–';
   document.getElementById('nextDist').textContent=next?Math.round(next.d):'–';
 }else{
   document.getElementById('nextName').textContent='Nicht auf der Strecke';
   document.getElementById('nextDist').textContent='–';
 }

 // Rundenlogik entlang der echten Streckenposition statt nur eines GPS-Kreises.
 // Startet erst bei Bewegung nahe Streckenbeginn und zählt nur einen echten Wrap von Ende -> Anfang.
 const now=fixTime;
 if(onTrack&&!jump&&trackLen>10000&&c.accuracy<=40){
   const startZone=Math.min(350,trackLen*.02),endZone=trackLen-startZone;
   if(lapStartMs==null&&routeP<startZone&&speedMps>3){lapStartMs=now;lastLapAt=now}
   const crossed=lastRouteProgress!=null&&lastRouteProgress>endZone&&routeP<startZone&&speedMps>5&&step<150;
   if(crossed&&lapStartMs&&now-lastLapAt>60000){
     const lapMs=now-lapStartMs;
     if(lapMs>240000&&lapMs<1800000){
       laps++;document.getElementById('laps').textContent=laps;document.getElementById('lastLap').textContent=fmtTime(lapMs);
       if(!bestLapMs||lapMs<bestLapMs){bestLapMs=lapMs;document.getElementById('bestLap').textContent=fmtTime(bestLapMs)}
     }
     lapStartMs=now;lastLapAt=now;
   }
   lastRouteProgress=routeP;
 }else if(!onTrack&&distanceToRing>5000){lastRouteProgress=null}

 // Navigationsmodus: Der Pfeil bleibt in der Mitte, die Karte bewegt sich darunter.
 // Dadurch wirkt die Bewegung natürlicher wie bei einer echten Navi-App.
 if(!displayPos)displayPos=pos.slice();
 if(!jump){
   const alpha = speedMps>30 ? .92 : speedMps>15 ? .86 : speedMps>5 ? .74 : .55;
   displayPos=[
     displayPos[0]+(pos[0]-displayPos[0])*alpha,
     displayPos[1]+(pos[1]-displayPos[1])*alpha
   ];
 }
 if(follow){
   const t=performance.now();
   if(t-lastMapMove>90){
     lastMapMove=t;
     const target=displayPos||pos;
     // Bei höherem Tempo etwas weiter herauszoomen: mehr Strecke voraus, weniger Kachel-Nachladen.
     const kmh=speedMps*3.6;
     const targetZoom=kmh>160?15.75:kmh>100?16.25:kmh>50?16.75:17.25;
     if(Math.abs(map.getZoom()-targetZoom)>.3)map.setZoom(targetZoom,{animate:false});
     // Direkte kleine Schritte sind auf iPhone stabiler als überlappende lange Animationen.
     map.panTo(target,{animate:false,noMoveStart:true});
   }
 }
 if(!jump){lastPos=pos;lastFixTime=fixTime}
}
function onErr(){document.getElementById('gps').textContent='GPS AUS';showError('Bitte Standortzugriff für Safari erlauben. GPS benötigt auf dem iPhone eine sichere Webseite (HTTPS).')}

window.addEventListener('error',e=>{console.error(e.error||e.message);});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);});
setTimeout(()=>map.invalidateSize(),250);

const geoOptions={enableHighAccuracy:true,maximumAge:0,timeout:10000};
function startGPS(){
  if(!navigator.geolocation){onErr();return}
  if(geoWatchId!=null)navigator.geolocation.clearWatch(geoWatchId);
  geoWatchId=navigator.geolocation.watchPosition(onPos,onErr,geoOptions);
}
startGPS();

// GPS-Wächter: erkennt, wenn iOS keine neuen Positionsdaten mehr liefert.
setInterval(()=>{
  if(!lastGoodFix)return;
  const age=Date.now()-lastGoodFix;
  if(age>8000){
    const gps=document.getElementById('gps');
    gps.textContent='GPS WARTET';
    gps.style.color='#fde68a';
  }
},2000);

window.addEventListener('offline',()=>{
  const gps=document.getElementById('gps');
  if(Date.now()-lastGoodFix<8000) gps.textContent='GPS · OFFLINE';
});

// iOS kann GPS/Wake-Lock nach Hintergrund/Displaywechsel pausieren.
// Beim Zurückkehren werden beide automatisch wieder aktiviert.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    keepAwake();
    startGPS();
    setTimeout(()=>map.invalidateSize(),150);
  }
});
document.addEventListener('touchstart',()=>keepAwake(),{passive:true});

function showWholeTrack(){
  tinyHaptic();
  follow=false;
  document.getElementById('drive').classList.remove('active');
  document.getElementById('all').classList.add('active');
  const pts=(trackCoords && trackCoords.length>2)
    ? trackCoords
    : corners.map(c=>[c.lat,c.lng]);
  const bounds=L.latLngBounds(pts);
  map.stop();
  map.invalidateSize({pan:false});
  map.fitBounds(bounds,{
    paddingTopLeft:[24,155],
    paddingBottomRight:[78,190],
    animate:false,
    maxZoom:15
  });
}
document.getElementById('all').onclick=showWholeTrack;
function followMyGPS(){
  tinyHaptic();
  follow=true;
  document.getElementById('all').classList.remove('active');
  document.getElementById('drive').classList.add('active');
  document.getElementById('navArrow').classList.add('on');
  startGPS();
  if(userMarker){
    const p=userMarker.getLatLng();
    userMarker.setOpacity(0);
    displayPos=[p.lat,p.lng];
    map.stop();
    map.invalidateSize({pan:false});
    map.setView(p,17,{animate:false});
  }
}
document.getElementById('drive').onclick=followMyGPS;
function toggleLabels(){
  tinyHaptic();
  labelsVisible=!labelsVisible;
  document.getElementById('labels').classList.toggle('active',labelsVisible);
  cornerLayers.forEach(m=>labelsVisible?m.addTo(map):map.removeLayer(m));
}
document.getElementById('labels').onclick=toggleLabels;
document.getElementById('record').onclick=()=>{recording=!recording;const b=document.getElementById('record');b.textContent=recording?'● Live-Spur aktiv':'▶ Spur fortsetzen';b.style.background=recording?'#16a34a':'#374151'};
document.getElementById('reset').onclick=()=>{tinyHaptic();displayPos=null;smoothedHeading=null;trail=[];trailLayer.setLatLngs([]);lastPos=null;lastFixTime=null;lastRouteProgress=null;totalM=0;laps=0;bestLapMs=null;lapStartMs=null;lastLapAt=0;document.getElementById('distance').textContent='0.0';document.getElementById('laps').textContent='0';document.getElementById('lastLap').textContent='–';document.getElementById('bestLap').textContent='–'};

window.addEventListener('orientationchange',()=>{
  setTimeout(()=>map.invalidateSize({pan:false}),250);
});
window.addEventListener('resize',()=>{
  clearTimeout(window.__ringdayResizeTimer);
  window.__ringdayResizeTimer=setTimeout(()=>map.invalidateSize({pan:false}),120);
});

keepAwake();
loadTrack();
if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs) await r.unregister();
      if('caches' in window){
        const names=await caches.keys();
        await Promise.all(names.map(n=>caches.delete(n)));
      }
    }catch(e){}
  });
}
</script>
